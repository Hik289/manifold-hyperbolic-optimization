name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Geometry and protocol checks
        run: |
          python experiments/revision/validate_geometry.py
          python -m unittest discover -s tests -v
          python scripts/summarize_results.py
      - name: Check paper figure and table reproduction
        run: |
          python paper/scripts/reproduce_figures.py --output-dir artifacts/figures
          python paper/scripts/reproduce_positive_tables.py --output-dir artifacts/tables
